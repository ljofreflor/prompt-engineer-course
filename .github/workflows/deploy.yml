name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          TEACHER_USER: ${{ secrets.TEACHER_USER }}
          TEACHER_PASSWORD: ${{ secrets.TEACHER_PASSWORD }}
          SITE_URL: https://ljofreflor.github.io
          BASE_PATH: /prompt-engineer-course
        run: |
          export TEACHER_USER="${TEACHER_USER:-profesor}"
          if [ -z "$TEACHER_PASSWORD" ]; then
            echo "TEACHER_PASSWORD secret missing; using placeholder (set repo secret)."
            export TEACHER_PASSWORD="cambiar-esta-clave"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
