# Suite mínima de regresión de prompt (Taller 1)
cases:
  - id: invoice
    input: "No me llegó la factura de marzo"
    expect_categoria: facturacion
    expect_abstener: false
  - id: vpn
    input: "El VPN corta a los 5 minutos"
